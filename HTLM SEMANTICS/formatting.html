<!DOCTYPE html>
<html>
<head>
    <title>This is my book</title>
</head>
<body>
    <!-- bold -->
    <b>I am a bolded text.</b>
    <br />
    <!-- italic -->
    <i>I am an italic text.</i>
    <br />
    <!-- underline -->
    <u>I am an underlined text.</u>
    <br />
    <!-- code -->
    <code>I am a code text.</code>
    <br />
    <!-- typewriter text -->
    <tt>I am a small text.</tt>
    <br />
    <!-- small text -->
    <small>I am a small text.</small>
    <br />
    <!-- emphasized -->
    <em>I am an emphasized text.</em>
    <br />
    <!-- strong text -->
    <strong>I am a strong text.</strong>
    <br />
    <!-- marked text -->
    <mark>I am marked text.</mark>
    <br />
    <!-- quoted text -->
    <q>I am an enquoted text.</q>
    <br />
    <!-- striked text -->
    <s>I am a striked text.</s>
    <br />
    <!-- mixed formatted -->
    <b><i><u><mark><q> I am a mixed formatted text. </q></mark></u></i></b>
    </body>
    </html>
